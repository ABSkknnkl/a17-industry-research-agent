      - generic: 核心结论速览： 福建省国产乘用车1-6月累计销量212.0k，同比下降19.21%：各月同比全线负增长，市场复苏动力不足，6月同比降幅24.39%。 新能源渗透率达56.86%，已超越燃油成为市场主流：纯电动车型86.8k仅小幅下滑6.02%，是市场核心支柱；汽油车型同比下滑28.01%。 0.0L零排量车型占比40.96%，已是第一大排量类别：1AT以50.19%份额稳居变速箱首位，对应纯电车型仅小幅回落5.23%。 比亚迪、吉利稳居销量前两位但同比下滑：比亚迪跌幅达39.76%；零跑、极氪、蔚来份额明显提升，蔚来同比增幅超100%。 自主品牌占据64.88%份额绝对主导：但同比下滑14.03%；德系、日系、韩系全部走弱。 厦门、福州、泉州三大核心城市领跑：厦门58.2k居首，福州51.7k、泉州50.9k，三城集中省内大部分购买力。 SUV抗跌性最优，同比仅下滑10.48%：轿车同比大跌28.38%，交叉型降幅达40.48%。H2：福建省汽车市场全景——沿海市场的承压与新能源突围。2026年上半年，福建省汽车市场整体承压运行，三大板块表现分化。国产乘用车累计销量212.0k，同比下降19.21%，各月同比全线负增长。进口乘用车6.5k，同比下降32.17%，全国排名第9位。商用车34.8k，同比微增1.88%，是唯一正增长板块。国产乘用车月度走势：1月开局42.2k，同比小幅下滑7.10%；2月受春节影响跌至24.0k，同比跌幅扩大至24.99%；3月迎来阶段性旺季环比上涨43.13%回升至34.3k；4至6月高位震荡，月度销量稳定在33k-39k区间。需求疲软源于燃油车型持续萎缩，终端购车需求缺乏持续增量。（数据来源：求信咨询、吉图咨询、361ci《2026H1福建省汽车市场分析报告》）。H2：动力总成与能源结构——零排量成为第一大排量类别。2026年上半年福建国产乘用车动力总成呈现新能源动力持续壮大、传统燃油动力普遍下滑的格局。排量维度，0.0L零排量车型销量86.8k，市场占比40.96%，同比仅小幅下滑6.02%，抗跌能力显著优于燃油车型，已经是市场第一大排量类别。燃油板块中1.5L份额30.76%、2.0L占比23.09%，是燃油市场主力，但同比分别下滑29.17%、19.26%。1.6L、2.5L排量跌幅进一步扩大。变速器结构方面，1AT以50.19%份额稳居首位，对应纯电动车型，销量小幅回落5.23%；CVT、7DCT、8AT、9AT全部出现两位数同比下滑，传统燃油变速箱市场需求持续萎缩。细分市场动力结构差异： 轿车市场：0排量销量规模领先但同比下滑；1.2L、1.5L燃油跌幅显著；CVT同比大跌41.75%。 SUV市场：0排量同比增长18.64%，是唯一实现正增长的排量区间；1AT同比上涨10.51%，印证电动化趋势。 MPV市场：2.0L降幅达42.51%，大排量燃油MPV需求快速收缩；8AT降幅超四成。燃料结构层面，新能源合计占比56.86%，已经超越燃油车型。纯电动86.8k仅小幅下滑6.02%是市场核心支柱；汽油车型占比39.41%，同比下滑28.01%。（数据来源：求信咨询、吉图咨询、361ci《2026H1福建省汽车市场分析报告》）。H2：车企竞争格局——新旧势力分化明显。TOP20车企合计市场份额79.46%，头部集中度小幅微降。比亚迪、吉利稳居销量前两位，但两家车企同比均出现下滑，比亚迪跌幅达39.76%，份额同步收缩3.46个百分点。奇瑞排名提升两位，依靠稳定表现跑赢大盘。传统合资车企普遍承压，一汽大众、上汽大众、广丰、东风本田同比全部下滑，份额持续流失。新能源新生势力走出分化行情，零跑、极氪、蔚来份额实现明显提升，蔚来同比增幅超100%，极氪排名大幅上升13位；特斯拉小幅下滑，小米保持正向增长。整体来看，市场存量博弈特征突出。老牌自主龙头、主流合资车企普遍销量下行，具备产品迭代能力的新能源品牌持续收割份额。（数据来源：求信咨询、吉图咨询、361ci《2026H1福建省汽车市场分析报告》）。H2：各车系表现——自主主导但内部分化。各车系全面下行，自主品牌依旧占据绝对主导地位，市场份额达64.88%。自主板块销量136.5k，同比下滑14.03%，跌幅低于德系、日系、韩系，展现更强韧性。合资阵营承压显著，德系、日系份额分别为16.03%、13.07%，同比降幅依次达到26.84%、30.47%。韩系萎缩最为严重，同比下滑33.69%，市场存在感持续走低。自主品牌内部分化加剧，比亚迪、五菱销量大幅下滑，比亚迪跌幅高达43.94%；零跑、极氪、问界、小米等新能源品牌逆势实现正增长，依托纯电与增程产品抢占市场增量。合资品牌中大众、丰田为头部但销量同步走低，本田下滑幅度突出。整体市场存量竞争格局清晰，传统燃油导向品牌普遍走弱，具备新能源产品矩阵的车企获得增长空间。（数据来源：求信咨询、吉图咨询、361ci《2026H1福建省汽车市场分析报告》）。H2：区域市场格局——厦福泉三核引领与地市分化。福建省国产乘用车销量212.0k，全国市场份额2.46%，位列全国第15位，排名与去年同期持平。省内全部地市销量同比均出现下滑。区域呈现厦门、福州、泉州三大核心城市领跑的格局。厦门以58.2k销量位居首位，福州、泉州分别达51.7k、50.9k，三座城市构成省内核心消费市场。其余地市体量明显偏小，漳州15.3k、莆田10.4k、龙岩8.0k依次递减，南平仅4.8k。各地市下行幅度有所分化，宁德跌幅相对温和同比下滑13.00%；漳州下行压力最大同比降幅达23.16%，莆田、三明、南平跌幅同样超20%。核心城市消费基础扎实，抗风险能力优于闽西、闽北等地市。细分市场层面，SUV在各地需求量普遍高于轿车与MPV。厦门SUV同比仅下滑6.33%是全省表现最佳的细分板块；莆田、宁德MPV实现小幅正增长，局部需求存在增量机会。（数据来源：求信咨询、吉图咨询、361ci《2026H1福建省汽车市场分析报告》）。H2：乘用车细分市场——SUV抗跌，纯电SUV唯一正增长。车型结构以SUV与轿车为主，SUV销量119.3k占比56.26%，同比下滑10.48%，跌幅显著小于轿车、MPV。轿车销量84.1k份额39.69%，同比大跌28.38%；MPV、交叉型乘用车同样大幅萎缩，交叉车型降幅达40.48%。轿车市场：B级、A级为销量主力但各级别同比全部下滑，A00级跌幅高达63.37%；A0级轿车逆势提升份额，低端代步需求持续出清。轿车TOP20中，星愿登顶销量榜首，轩逸、凯美瑞等传统燃油轿车同比下滑明显，小米SU7、小鹏M03等纯电车型入榜。SUV市场：结构性分化最为突出，C级、D级中大型SUV销量大幅上涨，份额分别提升10.03、2.86个百分点。SUV TOP20中，小米YU7、蔚来ES8、启源Q05多款新能源车型大幅跃升，特斯拉Model Y稳居首位。MPV市场：以C级车型为主力占据六成份额；微面、轻客断崖式下滑，家用中大型MPV需求走强。MPV TOP20中，星光730全新上榜，高山、小鹏X9保持增长。整体来看，省内购车升级特征明显，入门级代步车型持续萎缩，中大型轿车、SUV、MPV迎来扩张窗口。（数据来源：求信咨询、吉图咨询、361ci《2026H1福建省汽车市场分析报告》）。H2：进口乘用车——高端消费持续收缩。2026年上半年福建进口乘用车累计销量6.5k，全国市场份额3.28%，全国排名第9位，较上年同期下滑1位。各月销量均低于去年同期，同比跌幅从1月-16.04%持续扩大至6月-42.49%，1-6月累计同比下滑32.17%。动力与品牌结构：进口车以燃油动力为主，2.0L车型占据78.35%绝对份额同比小幅上涨3.80%；3.0L、4.0L、纯电0排量同比均显著下跌。日系份额53.01%位居首位，德系40.96%，两大车系合计超九成。丰田汽车、戴姆勒、宝马稳居车企前三，雷克萨斯成为区域销量第一进口品牌。车型与区域：轿车销量3.4k占比52.78%，SUV销量3.0k占比45.57%，二者同比跌幅分别达32.14%、31.30%。汽油车型份额高达86.78%，同比下滑28.42%。省内厦门2.3k领跑，福州、泉州紧随其后，三地构成核心市场。进口车市场承压源于国产高端新能源持续分流豪华进口消费需求，叠加关税、汇率因素及终端价格竞争加剧。（数据来源：求信咨询、吉图咨询、361ci《2026H1福建省汽车市场分析报告》）。H2：商用车市场——纯电驱动微增复苏。2026年上半年福建商用车累计销量34.8k，全国市场份额2.26%，位列全国第19位，较去年同期排名上升1位，同比微增1.88%是三大板块中唯一正增长。月度走势：1月4.5k，2月回落至2.4k同比-51.85%，3月快速回暖至7.9k同比+28.05%，4至6月维持6k-7.4k平稳运行。1-6月累计同比微增1.88%，整体增长动能偏弱。车型结构：货车占82.85%，轻型货车20.3k占比58.40%为市场核心支柱但同比下滑11.24%；重型货车8.0k同比增长34.17%形成重要支撑。轻型客车5.4k同比提升33.46%拉动客车板块。燃料结构：纯电动车型15.4k占比44.18%，同比大幅增长74.87%，成为第一大能源类型；柴油车型占比36.46%同比下滑21.18%。零排量车型占比44.20%同比大幅增长74.75%。区域与车企：福州、泉州各7.6k领跑，厦门6.3k紧随其后。上汽通用五菱3.7k位居车企首位，远程新能源商用车同比大幅增长45%。（数据来源：求信咨询、吉图咨询、361ci《2026H1福建省汽车市场分析报告》）。H2：未来6-12个月机会洞察。机会赛道一：纯电动SUV（成熟度高，市场空间大）。纯电动SUV实现18.64%正向增长，是唯一增量品类。C级、D级中大型SUV份额分别提升10.03、2.86个百分点。SUV新能源渗透率59.94%提升7.67个百分点。 渗透率：约55-60%。 爆发窗口：持续增长中。 推荐优先级：★★★★★。机会赛道二：新能源商用车（成熟度高，市场空间大）。纯电商用车同比大幅增长74.87%，占比44.18%成为第一大能源类型。零排量车型占比44.20%同比+74.75%。远程新能源商用车同比+45%。 渗透率：约40-45%。 爆发窗口：已进入加速期。 推荐优先级：★★★★★。机会赛道三：新能源MPV（成熟度中，市场空间大）。MPV新能源渗透率60.82%为三大品类最高，插混MPV支撑需求。高山、小鹏X9保持增长，家用中大型MPV需求走强。 渗透率：约55-60%。 爆发窗口：未来1-2年。 推荐优先级：★★★★☆。机会赛道四：自主新能源品牌（成熟度高，竞争激烈）。自主品牌占64.88%，零跑、极氪、蔚来份额明显提升，蔚来同比+100%。小米SU7、小鹏M03等纯电车型持续入榜。 渗透率：约60-65%。 爆发窗口：已进入白热化。 推荐优先级：★★★★☆。多角色行动建议。 车企与品牌方：加速纯电动SUV产品布局，重点关注C级中大型SUV市场；商用车领域加大纯电车型投放；传统燃油车企需加速电动化转型。 经销商：巩固厦门、福州、泉州三大核心市场；针对闽西、闽北地市优化产品结构，导入高竞争力新能源产品。 政策制定者：关注商用车电动化转型趋势（纯电占比44.18%），加快充电基础设施在闽西、闽北的覆盖。 投资者：关注福建新能源商用车赛道（纯电+74.87%）及新能源SUV增量机会。延伸阅读。以上为报告核心趋势分析，如需获取完整报告详细数据及全部车型榜单，请访问下载页下载完整PDF报告。FAQ区块。Q1：2026年上半年福建省汽车市场的整体表现如何？A1：国产乘用车累计212.0k，同比-19.21%，各月同比全线负增长；进口乘用车6.5k同比-32.17%，全国排名第9位；商用车34.8k同比+1.88%，是唯一正增长板块。Q2：福建省新能源汽车渗透率是多少？A2：国产乘用车新能源渗透率56.86%已超越燃油。SUV新能源渗透率59.94%最高，MPV达60.82%，轿车52.42%。纯电动SUV增长18.64%是唯一增量品类。Q3：哪些品牌在福建市场表现最好？A3：比亚迪、吉利稳居前两位但大幅下滑（比亚迪-39.76%）。零跑、极氪、蔚来份额明显提升，蔚来同比+100%。商用车上汽通用五菱领跑，远程同比+45%。Q4：福建省各城市汽车市场表现如何？A4：厦门58.2k、福州51.7k、泉州50.9k三城领跑。全省所有地市同比下滑，漳州-23.16%跌幅最大，宁德-13.00%相对温和。Q5：进口乘用车在福建市场的表现如何？A5：进口6.5k同比-32.17%，全国排名第9位。日系占53.01%、德系40.96%，汽油车占86.78%。国产高端新能源持续分流是核心原因。Q6：商用车市场的亮点在哪里？A6：商用车34.8k同比+1.88%是唯一正增长板块。纯电商用车同比+74.87%占比44.18%成为第一大能源类型。重型货车同比+34.17%形成重要支撑。数据来源说明。本报告所有数据均来源于求信咨询、吉图咨询、361ci联合出品的《2026H1福建省汽车市场分析报告》（2026年8月发布）。报告覆盖国产乘用车、进口乘用车、商用车三大板块，时间范围为2026年1-6月。
