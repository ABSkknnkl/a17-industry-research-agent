                - paragraph [ref=f3e292]: 研报摘要
                - paragraph [ref=f3e293]: 行情回顾：8月智能科技板块行情呈现“主题回暖、结构分化”特征。宽基指数层面，上证指数月度上涨4.02%，创业板指上涨2.83%，中证1000、中证2000分别上涨9.82%、13.20%，小盘成长风格占优。智能科技主题内部，人工智能产业指数月度上涨3.73%，中证人工智能主题指数上涨0.80%，创业板人工智能指数上涨10.80%；而恒生互联网、中证海外中国互联网50、中国互联网30等海外互联网指数分别下跌7.47%、5.62%、7.23%。对应人工智能主题ETF回暖，泛互联网类ETF延续调整。
                - paragraph [ref=f3e294]: 数据跟踪：1）游戏数据：2026年8月全球移动游戏总下载量环比下滑7.71%，同比增长0.1%；预估总收入环比下降约1.29%，同比增长3.49%，iOS存量用户支撑收入端相对稳定。2）影视数据：2026年暑期档内地电影总票房124.98亿元，同比增长4.4%；观影人次3.4亿，同比增长5.9%；上映新片103部，同比减少17部，《功夫女足》以23.1亿元档期票房居首。3）AI应用数据：8月国内ChatBot类产品访问量普遍回落，但AI办公智能体、开发者平台等产品流量整体增长36.72%，千问办公环比增长552.36%，腾讯WorkBuddy增长134.98%，DeepSeek API平台增长45.29%。
                - paragraph [ref=f3e295]: 行业要闻：1）智谱上线并开源GLM-5.3-Flash（320B-A18B），为GLM-5系列首个原生多模态模型；2）阿里发布并同步开源Qwen3.8-Flash，推理定价降至输入0.8元/百万Tokens、输出2.7元/百万Tokens，缓存命中价格低至0.1元/百万Tokens；3）腾讯混元发布Hy4preview并开源，总参数770B、激活参数49B，上下文长度突破1M。
                - paragraph [ref=f3e296]: 投资建议：建议关注人工智能主题ETF。8月智能科技板块主线清晰：一方面，国产及海外大模型进入密集迭代期，智谱、阿里、腾讯等相继开源新模型，输入/输出价格持续下探，推动AI应用从ChatBot向办公、Agent等工作流场景渗透；另一方面，人工智能主题指数与相关ETF在8月明显回暖，资金持续流入代表性产品。当前部分人工智能主题指数估值仍处于近三年较低分位，建议结合风险偏好逢低配置。
                - paragraph [ref=f3e297]: 风险提示：政策监管风险、技术发展不及预期风险、市场波动风险、跟踪误差风险、ETF流动性风险、AI推理算力供需阶段性紧张风险。
