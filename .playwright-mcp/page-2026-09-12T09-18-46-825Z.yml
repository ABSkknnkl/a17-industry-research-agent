              - generic [ref=f3e291]:
                - paragraph [ref=f3e292]: 随着国产手术机器人技术突破叠加产业政策加码共振，国产手术机器人进入商业化落地的快速发展期。建议关注具备多赛道布局能力、海外市场持续兑现的平台型龙头企业：微创机器人、精锋医疗；建议关注具备差异化创新能力的成长型企业，如聚焦核心赛道骨科手术机器人天智航。
                - paragraph [ref=f3e293]: 支撑评级的观点
                - paragraph [ref=f3e294]: 机器人辅助外科手术优势显著，国产手术机器人发展潜力较大。手术机器人凭借其操作精准、稳定且可重复性强的优势，显著提升微创手术临床获益，有望驱动其临床渗透率快速提升。据弗若斯特沙利文报告显示，全球手术机器人市场规模预计从2026年的328.0亿美元增长至2030年的631.2亿美元，复合增长率为17.8%。国产手术机器人有望凭借技术突破、政策支持与庞大的临床需求，在进口替代和全球化进程中释放较大发展潜力。2026年中国手术机器人市场规模为224.5亿元，预计2030年达到708.5亿元，复合增长率为33.3%，国产手术机器人市场有望持续高速增长。
                - paragraph [ref=f3e295]: 腔镜和骨科手术机器人进展领先，国内市场增长可期。细分市场来看，腔镜与骨科赛道凭借广泛的临床应用和清晰的商业化路径，发展较为成熟。腔镜手术机器人市场方面，中国腔镜手术机器人市场渗透率相较美国市场明显偏低，2024年国内机器人辅助腔镜手术渗透率仅为0.7%，提升空间较大。目前，达芬奇手术系统是全球腔镜手术机器人市场的主要产品，截至2024年底全球装机量占比约58.6%，随着国产腔镜手术机器人陆续获批，有望加速进口替代。中国多孔腔镜手术机器人装机量由2019年的134台增至2024年的502台，年复合增长率为30.2%，国产机器人装机量快速提升。据灼识咨询数据显示，国内骨科手术机器人市场呈现差异化竞争格局：在脊柱/创伤领域，市场高度集中于头部企业，天智航、美敦力及捷迈邦美三家装机量合计占比达98%，其中天智航以约87%的装机份额占据绝对领先地位；在关节置换领域，史赛克凭借其MAKO系统占据绝大部分市场份额。随着国产厂商技术持续突破及更多创新产品获批上市，有望加速进口替代进程，推动国产手术机器人市场份额提升。
                - paragraph [ref=f3e296]: 技术突破叠加政策共振，国产手术机器人企业加速突围。技术突破叠加产业政策共振，手术机器人行业进入快速发展期。从产业链看，上游核心零部件（减速器、控制器以及传感器）技术壁垒最高，当前仍存在进口依赖，未来聚焦核心零部件技术突破情况；中游整机环节，在政策加持下，微创机器人、天智航、威高、精锋医疗等国产品牌快速崛起，多款腔镜及骨科机器人已获批上市，正加速突围；下游应用场景以医疗机构为主，逐步从大三甲医院向二级医院及基层市场逐步渗透。政策层面，自2015年以来国家持续加码产业扶持，2026年1月新出台的医保立项指南解决了手术机器人“怎么收费”的核心痛点，并同步设立远程手术收费项目，有望加速机器人在各级医院的临床渗透。
                - paragraph [ref=f3e297]: 投资建议
                - paragraph [ref=f3e298]: 我们认为，随着国产手术机器人技术突破叠加产业政策加码共振，国产手术机器人进入商业化落地的快速发展期。建议关注具备多赛道布局能力、海外市场持续兑现的平台型龙头企业：微创机器人、精锋医疗；建议关注具备差异化创新能力的成长型企业，如聚焦核心赛道骨科手术机器人企业天智航。
                - paragraph [ref=f3e299]: 评级面临的主要风险
                - paragraph [ref=f3e300]: 医保支付及收费政策推进不及预期，国产替代进程不及预期，产品商业化以及推广不及预期，海外拓展不及预期。
