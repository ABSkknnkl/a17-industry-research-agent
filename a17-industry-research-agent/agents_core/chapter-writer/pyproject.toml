[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chapter-writer"
version = "0.1.0"
description = "Standalone evidence-grounded 7x3 research chapter writer"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27,<1", "pydantic>=2.7,<3"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
chapter-writer = "chapter_writer.cli:main"

[tool.setuptools.packages.find]
include = ["chapter_writer*"]

[tool.setuptools.package-data]
chapter_writer = ["skills/*/SKILL.md", "skills/*/_meta.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
