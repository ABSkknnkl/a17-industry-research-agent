[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "data-fetcher"
version = "0.1.0"
description = "Agent-first research data fetcher backed exclusively by Iwencai SkillHub"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "pydantic>=2.7,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
data-fetcher = "data_fetcher.cli:main"

[tool.setuptools.packages.find]
include = ["data_fetcher*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["live: requires real Iwencai and LLM credentials"]
