[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "report-fusion"
version = "0.1.0"
description = "Standalone research report fusion, consistency and export agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27,<1", "pydantic>=2.7,<3", "playwright>=1.45,<2"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
report-fusion = "report_fusion.cli:main"

[tool.setuptools.packages.find]
include = ["report_fusion*"]

[tool.setuptools.package-data]
report_fusion = ["skills/*/SKILL.md", "skills/*/_meta.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
