[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "data-interpreter"
version = "0.1.0"
description = "Evidence-grounded interpretation agent for structured research datasets"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "pydantic>=2.7,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
data-interpreter = "data_interpreter.cli:main"

[tool.setuptools.packages.find]
include = ["data_interpreter*"]

[tool.setuptools.package-data]
data_interpreter = ["skills/*/SKILL.md", "skills/*/_meta.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
