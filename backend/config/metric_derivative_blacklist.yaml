# 派生词否定表（2026-09-01 方案第二刀）
#
# 形态：{alias: [派生词, ...]}。确定性层命中 alias 后，扫描原文 ±8 字符
# 窗口，检出任一派生词则不 lock（不写死路由），标 derivative_suspected
# 降级交 L2 语义层判定，并写同名遥测事件。
#
# 维护规则（方案 §2 第四刀周度分流）：
# - 新词热修：直接改本文件即生效（按路径+修改时间缓存），不发版；
# - 词表为空或缺失时行为回退旧版（子串命中即 lock）；
# - 误伤申诉（如「产能利用率」）由最长匹配优先 + 窗口边界兜底，
#   不要在词表里打补丁。
#
# 特殊键 "*"（业务裁决 1，2026-09-01）：预测类诉求统一判派生——
# 其派生词对任意命中 alias 生效；命中后 L1 指标锁降级交 L2 裁决，
# 无对应结构化数据时触发澄清门，禁止路由查询历史指标替代预测结果。
"*":
  - 增量
  - 预计
  - 预测
  - 前瞻

产能:
  - 投资
  - 爬坡
  - 过剩
  - 周期
  - 释放
  - 扩张
  - 跑满
  - 落地
出货量:
  - 目标
  - 计划
  - 预期
  - 指引
价格:
  - 影响
  - 传导
  - 弹性
  - 敏感性
毛利率:
  - 影响
  - 贡献
  - 驱动
  - 敏感性
市场份额:
  - 影响
  - 变化原因
  - 趋势判断
