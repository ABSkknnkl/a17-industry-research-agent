# §5 缺口清单 + OBS 4.1（有效总产能）落地
shipment_volume:
  - 对外供货量
  - 发货规模
  - 外销出货
capacity_utilization:
  - 产线跑满程度
  - 生产负荷
market_share:
  - 行业占比
inventory_days:
  - 库存水平
  - 去库情况
  - 累库情况
