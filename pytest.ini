[pytest]
testpaths = agents_core backend eval
pythonpath =
    .
    backend
    agents_core/data-fetcher
    agents_core/data-analysis
    agents_core/chart-generator
    agents_core/chapter-writer
    agents_core/report-fusion
addopts = --import-mode=importlib -m "not live"
markers =
    live: requires real external Iwencai and LLM credentials (skipped by default in automated test suites)
