name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------
  # 0. 提交信息：硬拦纯数字 / AI prompt 泄漏；其余只 warning
  # ---------------------------------------------------------------
  commitlint:
    name: Commit Message
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Install commitlint
        run: npm install --no-save @commitlint/cli @commitlint/config-conventional
      - name: Lint commits in PR
        run: >-
          npx commitlint
          --from ${{ github.event.pull_request.base.sha }}
          --to ${{ github.event.pull_request.head.sha }}
          --verbose

  # ---------------------------------------------------------------
  # 1. 后端：ruff + pytest
  # ---------------------------------------------------------------
  backend:
    name: Backend (py3.12)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          pip install -e .

      - name: Lint
        run: |
          ruff check . --output-format=github || ruff check .
          ruff format --check . || true

      - name: Test
        env:
          PYTEST_DEBUG_TEMPROOT: ${{ runner.temp }}
          BASILISP_DO_NOT_CACHE: 1
        run: pytest -q --basetemp=${{ runner.temp }}/pytest

  # ---------------------------------------------------------------
  # 2. 前端：lint + typecheck + build
  # ---------------------------------------------------------------
  frontend:
    name: Frontend (node22)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install deps
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Lint
        run: npm run lint --if-present

      - name: Build
        run: npm run build --if-present

  # ---------------------------------------------------------------
  # 3. 仓库卫生：禁止测试产物入库（强制）
  #    PR 行数 / 变更文档：只 warning，不 fail
  # ---------------------------------------------------------------
  hygiene:
    name: Repo Hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Forbidden paths
        run: |
          set -euo pipefail
          FORBIDDEN=(
            ".pytest_tmp/"
            ".workbuddy/"
            ".workbuddy-ai/"
            ".trae/"
            ".trae-html-share-packages/"
            "node_modules/"
            "__pycache__/"
            ".venv/"
          )
          BASE=origin/${{ github.base_ref || 'main' }}
          git fetch --no-tags origin "${{ github.base_ref || 'main' }}"
          CHANGED=$(git diff --name-only "$BASE"...HEAD)
          BAD=""
          for f in $CHANGED; do
            for p in "${FORBIDDEN[@]}"; do
              case "$f" in *"$p"*) BAD="$BAD $f";; esac
            done
          done
          if [ -n "$BAD" ]; then
            echo "::error::以下文件不应提交：$BAD"
            exit 1
          fi

      - name: PR size (warning only)
        if: github.event_name == 'pull_request'
        run: |
          LINES=$(git diff --numstat origin/${{ github.base_ref }}...HEAD \
                  | awk '{a+=$1; d+=$2} END {print a+d}')
          echo "本次 PR 变更行数：${LINES:-0}"
          if [ "${LINES:-0}" -gt 400 ]; then
            echo "::warning::PR 变更 ${LINES} 行（建议但不强制拆分）。"
          fi

  # ---------------------------------------------------------------
  # 4. 变更文档：只 warning，不 fail
  # ---------------------------------------------------------------
  changelog:
    name: Change Doc
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check docs/changes (warning only)
        run: |
          set -euo pipefail
          BASE=origin/${{ github.base_ref }}
          git fetch --no-tags origin "${{ github.base_ref }}"
          CHANGED=$(git diff --name-only "$BASE"...HEAD -- docs/changes/ || true)

          if [ -n "$CHANGED" ]; then
            echo "✓ 变更文档已更新："
            echo "$CHANGED" | sed 's/^/    /'
            exit 0
          fi

          echo "::warning::未更新 docs/changes/（建议写，但不强制）。模板：docs/changes/TEMPLATE.md"
          exit 0
