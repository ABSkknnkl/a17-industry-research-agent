9F"/><text x="291.2" y="417" font-size="10.5" fill="#12201D" font-weight="700">3.80%</text><line x1="208" y1="124" x2="208" y2="316" stroke="#B8872F" stroke-width="2"/><line x1="202" y1="124" x2="214" y2="124" stroke="#B8872F" stroke-width="2"/><line x1="202" y1="316" x2="214" y2="316" stroke="#B8872F" stroke-width="2"/><text x="196" y="116" font-size="10.5" fill="#B8872F" font-weight="700" text-anchor="end">CR3 86.07%</text><text x="40" y="500" font-size="9.5" fill="#8A9995">样本合计 16,181.90 亿元；HHI 0.3375。比亚迪收入含手机部件及组装等 19.31%，不是纯汽车收入。</text><text x="40" y="542" font-size="9.5" fill="#8A9995">数据：同花顺问财 2025 年营业收入；仅五家样本；分母为五家收入合计。</text></svg>