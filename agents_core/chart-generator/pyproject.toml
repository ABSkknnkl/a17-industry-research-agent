[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chart-generator"
version = "0.1.0"
description = "Standalone evidence-grounded chart generation agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7,<3"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
chart-generator = "chart_generator.cli:main"

[tool.setuptools.packages.find]
include = ["chart_generator*"]

[tool.setuptools.package-data]
chart_generator = ["skills/*/SKILL.md", "skills/*/_meta.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
